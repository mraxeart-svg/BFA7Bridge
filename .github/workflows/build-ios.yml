name: Build iOS IPA

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Build unsigned iOS app
        run: |
          set -euo pipefail
          xcodebuild \
            -project BFA7Bridge.xcodeproj \
            -scheme BFA7Bridge \
            -sdk iphoneos \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package IPA
        run: |
          set -euo pipefail
          rm -rf Payload BFA7Bridge.ipa
          mkdir -p Payload
          cp -R "build/Build/Products/Debug-iphoneos/BFA7Bridge.app" Payload/
          /usr/bin/zip -r -q BFA7Bridge.ipa Payload
          rm -rf Payload
          test -f BFA7Bridge.ipa
          /usr/bin/unzip -l BFA7Bridge.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: BFA7Bridge-IPA
          path: BFA7Bridge.ipa
          if-no-files-found: error
          retention-days: 90
