name: Build iOS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          set -o pipefail
          xcodebuild \
            -project BFA7Bridge.xcodeproj \
            -scheme BFA7Bridge \
            -sdk iphoneos \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee xcodebuild.log
      - name: Report xcodebuild failure
        if: failure()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          log = Path('xcodebuild.log')
          if not log.exists():
              print('::error title=xcodebuild failed::xcodebuild.log was not created')
              raise SystemExit(0)
          lines = log.read_text(errors='replace').splitlines()[-120:]
          text = '\n'.join(lines)
          escaped = text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print(f'::error title=xcodebuild failed::{escaped}')
          PY
