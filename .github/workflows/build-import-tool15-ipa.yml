name: Build BFA7 Import Tool 15 IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-import-tool15-ipa:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app

      - name: Verify AES-CTR implementation
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/main.swift" <<'SWIFT'
          import Foundation

          let key = Data([0x2b, 0x7e, 0x15, 0x16, 0x28, 0xae, 0xd2, 0xa6, 0xab, 0xf7, 0x15, 0x88, 0x09, 0xcf, 0x4f, 0x3c])
          let counter = Data([0xf0, 0xf1, 0xf2, 0xf3, 0xf4, 0xf5, 0xf6, 0xf7, 0xf8, 0xf9, 0xfa, 0xfb, 0xfc, 0xfd, 0xfe, 0xff])
          let plaintext = Data([0x6b, 0xc1, 0xbe, 0xe2, 0x2e, 0x40, 0x9f, 0x96, 0xe9, 0x3d, 0x7e, 0x11, 0x73, 0x93, 0x17, 0x2a])
          let expected = Data([0x87, 0x4d, 0x61, 0x91, 0xb6, 0x20, 0xe3, 0x26, 0x1b, 0xef, 0x68, 0x64, 0x99, 0x0d, 0xb6, 0xce])
          let encrypted = try MIWBTAESCTR.encrypt(plaintext, key: key, initialCounter: counter)
          guard encrypted == expected else { fatalError("AES-CTR NIST vector mismatch") }
          let decrypted = try MIWBTAESCTR.encrypt(encrypted, key: key, initialCounter: counter)
          guard decrypted == plaintext else { fatalError("AES-CTR round trip mismatch") }
          SWIFT
          xcrun swiftc BFA7ImportTool15/MIWBTAESCTR.swift "$RUNNER_TEMP/main.swift" -o "$RUNNER_TEMP/aes-ctr-test"
          "$RUNNER_TEMP/aes-ctr-test"

      - name: Build app
        run: |
          set -euo pipefail
          xcodebuild \
            -project BFA7ImportTool15.xcodeproj \
            -scheme BFA7ImportTool15 \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build-import-tool15 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            clean build 2>&1 | tee "$RUNNER_TEMP/import-build.log"

      - name: Preserve declared Hotspot capability for re-signing
        run: |
          set -euo pipefail
          APP="build-import-tool15/Build/Products/Release-iphoneos/BFA7ImportTool15.app"
          codesign --force --sign - --generate-entitlement-der \
            --entitlements BFA7ImportTool15/BFA7ImportTool15.entitlements "$APP"
          codesign --verify --strict "$APP"

      - name: Verify Wi-Fi connection state and signed capability
        run: |
          set -euo pipefail
          xcrun swiftc BFA7ImportTool15/ImportSigningDiagnostics.swift BFA7ImportTool15/ImportWiFiConnector.swift tests/ImportWiFiTests.swift -o "$RUNNER_TEMP/import-wifi-tests" 2>&1 | tee "$RUNNER_TEMP/import-wifi-test.log"
          "$RUNNER_TEMP/import-wifi-tests" build-import-tool15/Build/Products/Release-iphoneos/BFA7ImportTool15.app/BFA7ImportTool15 2>&1 | tee -a "$RUNNER_TEMP/import-wifi-test.log"

      - name: Verify import protocol
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/import-analysis"
          "$RUNNER_TEMP/import-analysis/bin/python" -m pip install -r tools/requirements-import-analysis.txt
          "$RUNNER_TEMP/import-analysis/bin/python" -m unittest discover -s tests -p 'test_*.py'
          node tests/token_reader.test.js
          xcrun swiftc BFA7ImportTool15/ImportModels.swift BFA7ImportTool15/MIWBTAESCTR.swift BFA7ImportTool15/MIWBTProtocol.swift tests/ImportProtocolTests.swift -o "$RUNNER_TEMP/import-protocol-tests"
          "$RUNNER_TEMP/import-protocol-tests"

      - name: Verify media import
        run: |
          set -euo pipefail
          xcrun swiftc BFA7ImportTool15/ImportMediaProtocol.swift BFA7ImportTool15/ImportGalleryWriter.swift BFA7ImportTool15/ImportMediaProbe.swift tests/ImportMediaTransferTests.swift -o "$RUNNER_TEMP/import-media-tests"
          mkdir -p "$RUNNER_TEMP/import-fixtures"
          python3 tests/import_media_server.py 48295 "$RUNNER_TEMP/import-fixtures" &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:48295/v1/filelists >/dev/null; then
              break
            fi
            sleep 0.1
          done
          "$RUNNER_TEMP/import-media-tests" http://127.0.0.1:48295 "$RUNNER_TEMP/import-fixtures" 2>&1 | tee "$RUNNER_TEMP/import-media-test.log"

      - name: Upload import test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ImportTestDiagnostics
          path: |
            ${{ runner.temp }}/import-build.log
            ${{ runner.temp }}/import-wifi-test.log
            ${{ runner.temp }}/import-media-test.log
          if-no-files-found: ignore

      - name: Package IPA for re-signing
        run: |
          set -euo pipefail
          APP="build-import-tool15/Build/Products/Release-iphoneos/BFA7ImportTool15.app"
          test -d "$APP"
          rm -rf Payload BFA7ImportTool15.ipa
          mkdir Payload
          cp -R "$APP" Payload/
          /usr/bin/zip -qry BFA7ImportTool15.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: BFA7ImportTool15-IPA
          path: BFA7ImportTool15.ipa
          if-no-files-found: error
